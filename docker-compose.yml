# Local infrastructure for development. The api, worker and web run on the host
# with `npm run dev` so they reload on save; only stateful services live here.
name: lanternly

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-lanternly}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lanternly}
      POSTGRES_DB: ${POSTGRES_DB:-lanternly}
    # Bound to localhost so the database is never reachable from the network.
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-lanternly}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7.4-alpine
    # BullMQ needs keys to survive memory pressure, so never evict them.
    command: ["redis-server", "--maxmemory-policy", "noeviction"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Catches every email the app sends so alerts can be read at http://localhost:8025.
  mailpit:
    image: axllent/mailpit:v1.32
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"

volumes:
  postgres-data:
  redis-data:
