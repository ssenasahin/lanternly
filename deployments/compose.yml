# Production: everything on one machine with Docker. From the repository root:
#   cp deployments/.env.example deployments/.env   (then fill it in)
#   docker compose -f deployments/compose.yml --env-file deployments/.env up -d --build
name: lanternly-prod

x-app: &app
  build:
    context: ..
    target: app
  image: lanternly-app
  restart: unless-stopped
  env_file: .env
  environment:
    DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    REDIS_URL: redis://redis:6379
    WEB_ORIGIN: https://${DOMAIN}
    PUBLIC_API_URL: https://${DOMAIN}
    # Caddy is the one proxy in front of the API; the client IP comes from it.
    TRUST_PROXY: "1"

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    # No ports: only the containers on this network can reach the database.
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # BullMQ needs its keys to survive memory pressure, and the schedule to survive
    # a restart, so never evict and append every write to disk.
    command: ["redis-server", "--maxmemory-policy", "noeviction", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Applies new migrations, then exits; the api and worker wait for it.
  migrate:
    <<: *app
    restart: "no"
    command: ["npx", "prisma", "migrate", "deploy", "--schema", "db/prisma/schema.prisma"]
    depends_on:
      postgres:
        condition: service_healthy

  api:
    <<: *app
    command: ["node", "api/dist/index.js"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  worker:
    <<: *app
    command: ["node", "worker/dist/index.js"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  web:
    build:
      context: ..
      target: web
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - caddy-data:/data
    depends_on:
      - api

volumes:
  postgres-data:
  redis-data:
  caddy-data:
